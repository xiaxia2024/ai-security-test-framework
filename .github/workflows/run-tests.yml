name: Run Unified AI Tests

on:
  push:
    branches:
      - 主要
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QWEN_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai requests

    - name: Run unified tester
      run: |
        python src/unified_tester.py

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: results/
